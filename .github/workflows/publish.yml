name: Publish npm

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Require tag commit on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Set up Node and npm registry
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.2"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate tag, version, and changelog
        run: node scripts/validate-release.mjs --tag "$GITHUB_REF_NAME"

      - name: Test
        run: bun test

      - name: Type check
        run: bun x tsc --noEmit

      - name: Lint
        run: bun x eslint .

      - name: Check formatting
        run: bun x prettier --check .

      - name: Build
        run: bun build index.ts --outdir dist --target node

      - name: Select npm distribution tag
        id: distribution
        shell: bash
        run: |
          if node -e "process.exit(require('./package.json').version.includes('-') ? 0 : 1)"; then
            echo "tag=next" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        run: npm publish --access public --provenance --tag "${{ steps.distribution.outputs.tag }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
