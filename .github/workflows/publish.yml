name: Publish npm

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to validate and publish"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}

      - name: Require an existing tag on main
        shell: bash
        run: |
          git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"
          test "$(git rev-parse HEAD)" = "$(git rev-list -n 1 "$RELEASE_TAG")"
          git merge-base --is-ancestor HEAD origin/main

      - name: Set up Node and npm registry
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.2"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate tag, version, and changelog
        run: node scripts/validate-release.mjs --tag "$RELEASE_TAG"

      - name: Test
        run: bun test

      - name: Type check
        run: bun x tsc --noEmit

      - name: Lint
        run: bun x eslint .

      - name: Check formatting
        run: bun x prettier --check .

      - name: Build
        run: bun build index.ts --outdir dist --target node

      - name: Select npm distribution tag
        id: distribution
        shell: bash
        run: |
          if node -e "process.exit(require('./package.json').version.includes('-') ? 0 : 1)"; then
            echo "tag=next" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish tag to npm
        if: github.event_name == 'push'
        run: npm publish --access public --provenance --tag "${{ steps.distribution.outputs.tag }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Retry existing tag publication
        if: github.event_name == 'workflow_dispatch'
        # Explicit validation above replaces the tagged source's lifecycle guard.
        run: npm publish --ignore-scripts --access public --provenance --tag "${{ steps.distribution.outputs.tag }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
